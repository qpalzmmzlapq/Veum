/* ============================================================================
   Interaction init
   ============================================================================ */
function initScrollReveal(){
  const els = $$('[data-reveal]');
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){ els.forEach(el => el.classList.add('revealed')); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, { threshold: .12, rootMargin: '0px 0px -8% 0px' });
  els.forEach(el => { el.classList.remove('revealed'); io.observe(el); });
}

function initCounters(){
  const els = $$('[data-count]');
  if(!els.length) return;
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){
        const el = e.target;
        const to = parseFloat(el.dataset.count);
        const suffix = el.dataset.suffix || '';
        const prefix = el.dataset.prefix || '';
        const decimals = parseInt(el.dataset.decimals) || 0;
        el.textContent = prefix + '0' + suffix;
        Anim.countUp(el, to, { suffix, prefix, decimals, dur: 1500 });
        io.unobserve(el);
      }
    });
  }, { threshold: .4 });
  els.forEach(el => io.observe(el));
}

function initTilt(){
  $$('[data-tilt]').forEach(card => {
    if(card.dataset.tiltInit) return;
    card.dataset.tiltInit = '1';
    const strength = parseFloat(card.dataset.tilt) || 4;
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5;
      const y = (e.clientY - r.top) / r.height - .5;
      card.style.transform = `perspective(900px) rotateX(${(-y * strength).toFixed(2)}deg) rotateY(${(x * strength).toFixed(2)}deg)`;
    });
    card.addEventListener('mouseleave', () => { card.style.transform = ''; });
  });
}

function initMagnetic(){
  $$('[data-magnetic]').forEach(btn => {
    if(btn.dataset.magInit) return;
    btn.dataset.magInit = '1';
    const strength = parseFloat(btn.dataset.magnetic) || 6;
    btn.addEventListener('mousemove', e => {
      const r = btn.getBoundingClientRect();
      const x = e.clientX - r.left - r.width / 2;
      const y = e.clientY - r.top - r.height / 2;
      btn.style.transform = `translate(${(x / r.width * strength).toFixed(2)}px, ${(y / r.height * strength).toFixed(2)}px)`;
    });
    btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
  });
}

function bind(){
  /* Drawer */
  $$('[data-drawer-open]').forEach(el => el.addEventListener('click', toggleDrawer));
  $$('[data-drawer-close]').forEach(el => el.addEventListener('click', closeDrawer));

  /* Navigation */
  $$('[data-go]').forEach(el => el.addEventListener('click', e => {
    e.preventDefault();
    const view = el.dataset.go;
    if(view === 'auth' && el.dataset.role) authLocal.role = el.dataset.role;
    if(view === 'dashboard' && !state.user) return go('auth');
    go(view, { sideTab: el.dataset.side });
  }));

  /* Reset */
  $$('[data-reset]').forEach(el => el.addEventListener('click', () => { resetAll(); toast('Вы вышли из аккаунта'); }));

  /* FAQ accordion */
  $$('[data-faq]').forEach(el => el.addEventListener('click', () => {
    const item = el.closest('.faq-item');
    if(item){ item.classList.toggle('open'); Sound.click(); }
  }));

  /* Nav scroll */
  const nav = $('#nav');
  if(nav){ const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 8); window.addEventListener('scroll', onScroll, { passive: true }); onScroll(); }

  /* Theme */
  $$('[data-theme-toggle]').forEach(el => el.addEventListener('click', () => { toggleTheme(); render(); }));

  /* Sound toggle */
  $$('[data-sound-toggle]').forEach(el => el.addEventListener('click', () => { Sound.toggle(); el.textContent = Sound.enabled ? '♪' : '○'; el.setAttribute('data-tooltip', Sound.enabled ? 'Звук вкл' : 'Звук выкл'); }));

  /* Notifications */
  $$('[data-notif-open]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); state.notifOpen ? closeNotifications() : openNotifications(); }));
  $$('[data-notif-close]').forEach(el => el.addEventListener('click', closeNotifications));
  $('[data-notif-read-all]')?.addEventListener('click', () => { state.notifications.forEach(n => n.unread = false); save(); renderNotifications(); updateNotifBadge(); });

  /* Palette */
  $$('[data-palette-open]').forEach(el => el.addEventListener('click', openPalette));
  $$('[data-palette-close]').forEach(el => el.addEventListener('click', closePalette));
  const pi = $('#palette-input');
  if(pi) pi.addEventListener('input', e => renderPalette(e.target.value));

  /* Chat */
  $$('[data-chat-open]').forEach(el => el.addEventListener('click', () => openChat(el.dataset.chatOpen || 'Диалог')));
  $$('[data-chat-close]').forEach(el => el.addEventListener('click', closeChat));
  $('[data-chat-send]')?.addEventListener('click', sendChat);
  $('#chat-input')?.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); sendChat(); } });

  /* Auth */
  $$('[data-auth-tab]').forEach(el => el.addEventListener('click', () => { authLocal.tab = el.dataset.authTab; render(); }));
  $$('[data-role-pick]').forEach(el => el.addEventListener('click', () => { authLocal.role = el.dataset.rolePick; render(); }));
  const an = $('#auth-name'), ae = $('#auth-email');
  if(an) an.addEventListener('input', e => authLocal.name = e.target.value);
  if(ae) ae.addEventListener('input', e => authLocal.email = e.target.value);

  $('[data-auth-submit]')?.addEventListener('click', () => {
    const name = ($('#auth-name')?.value || '').trim();
    const email = ($('#auth-email')?.value || '').trim();
    const pass = ($('#auth-pass')?.value || '').trim();
    const fName = $('#f-name'), fEmail = $('#f-email'), fPass = $('#f-pass');
    let err = false;
    [fName, fEmail, fPass].forEach(f => f?.classList.remove('error','shake'));
    if(!name){ fName?.classList.add('error','shake'); err = true; }
    if(!email || !email.includes('@')){ fEmail?.classList.add('error','shake'); err = true; }
    if(authLocal.tab === 'register' && pass.length < 8){ fPass?.classList.add('error','shake'); err = true; }
    if(err){ Sound.error(); setTimeout(() => { [fName, fEmail, fPass].forEach(f => f?.classList.remove('shake')); }, 500); return toast('Проверьте выделенные поля'); }
    state.user = { name, email };
    state.role = authLocal.role;
    state.level = authLocal.role === 'specialist' ? (state.level || 'mid') : null;
    state.profile = { github: '', comment: '', tested: false, scores: null };
    state.sideTab = authLocal.role === 'client' ? 'new' : 'overview';
    save();
    confetti(innerWidth / 2, innerHeight / 2); Sound.success();
    go('dashboard');
    toast(authLocal.tab === 'register' ? 'Аккаунт создан' : 'Добро пожаловать');
  });

  $$('[data-oauth]').forEach(el => el.addEventListener('click', () => {
    const nm = el.dataset.oauth + ' Пользователь';
    const em = 'user@' + el.dataset.oauth.toLowerCase() + '.com';
    state.user = { name: nm, email: em };
    state.role = authLocal.role;
    state.level = authLocal.role === 'specialist' ? 'mid' : null;
    state.profile = { github: '', comment: '', tested: false, scores: null };
    state.sideTab = authLocal.role === 'client' ? 'new' : 'overview';
    save();
    confetti(innerWidth / 2, innerHeight / 2); Sound.success();
    go('dashboard');
  }));

  /* Side tabs */
  $$('[data-side]').forEach(el => el.addEventListener('click', () => { state.sideTab = el.dataset.side; save(); render(); }));
  $$('[data-side-client]').forEach(el => el.addEventListener('click', () => { state.sideTab = el.dataset.sideClient; save(); render(); }));

  /* Profile flow */
  $$('[data-fill-profile]').forEach(el => el.addEventListener('click', openFillProfileModal));
  $$('[data-run-test]').forEach(el => el.addEventListener('click', openRunTestModal));
  $$('[data-share-profile]').forEach(el => el.addEventListener('click', openShareProfile));
  $$('[data-compare-open]').forEach(el => el.addEventListener('click', openCompareModal));

  /* Wizard init */
  initWizard();

  /* Talent search & filters */
  const ts = $('#talent-search');
  if(ts) ts.addEventListener('input', e => {
    state.filters.search = e.target.value; save();
    const container = $('#talent-list');
    if(container){
      const filtered = filterSpecialists(MOCK_SPECIALISTS);
      container.innerHTML = filtered.length ? filtered.map(s => talentCardHtml(s)).join('') : `<div class="empty-state"><div class="ico">⌕</div><div class="t">Ничего не найдено</div><div class="d">Попробуйте изменить фильтры или поисковый запрос.</div></div>`;
      bindTalentActions();
    }
  });
  const tl = $('#talent-level');
  if(tl) tl.addEventListener('change', e => { state.filters.level = e.target.value; save(); render(); });

  bindTalentActions();

  /* Contact form */
  $$('[data-contact]').forEach(el => el.addEventListener('click', () => {
    const nm = $('#contact-name'), em = $('#contact-email'), msg = $('#contact-msg');
    let err = false;
    [nm, em, msg].forEach(f => f?.closest('.field')?.classList.remove('error','shake'));
    if(!nm?.value){ nm?.closest('.field')?.classList.add('error','shake'); err = true; }
    if(!em?.value || !em.value.includes('@')){ em?.closest('.field')?.classList.add('error','shake'); err = true; }
    if(!msg?.value || msg.value.length < 10){ msg?.closest('.field')?.classList.add('error','shake'); err = true; }
    if(err){ Sound.error(); setTimeout(() => [nm, em, msg].forEach(f => f?.closest('.field')?.classList.remove('shake')), 500); return toast('Проверьте выделенные поля'); }
    confetti(innerWidth / 2, innerHeight / 2); Sound.success();
    toast('Спасибо! Мы свяжемся с вами в течение рабочего дня');
  }));

  /* Article clicks */
  $$('[data-article]').forEach(el => el.addEventListener('click', () => toast('Статья: ' + el.dataset.article)));

  /* Press kit */
  $$('[data-press-kit]').forEach(el => el.addEventListener('click', () => { confetti(innerWidth / 2, innerHeight / 2); toast('Пресс-кит: демо-версия'); }));

  /* Apply */
  $$('[data-apply]').forEach(el => el.addEventListener('click', () => toast('Спасибо! Мы свяжемся с вами')));

  /* Offers */
  $$('[data-offer]').forEach(el => el.addEventListener('click', e => { if(e.target.closest('button')) return; toast('Заказ: ' + el.dataset.offer); }));
}

function bindTalentActions(){
  $$('[data-chat-open]').forEach(el => {
    if(el.dataset.bound) return;
    el.dataset.bound = '1';
    el.addEventListener('click', () => openChat(el.dataset.chatOpen || 'Диалог'));
  });
  $$('[data-favorite]').forEach(el => {
    if(el.dataset.bound) return;
    el.dataset.bound = '1';
    el.addEventListener('click', () => {
      const id = el.dataset.favorite; const i = state.favorites.indexOf(id);
      if(i >= 0){ state.favorites.splice(i, 1); el.textContent = '☆'; toast('Удалено из избранного'); }
      else { state.favorites.push(id); el.textContent = '★'; toast('Добавлено в избранное'); }
      save();
    });
  });
}

/* ----------------------------------------------------------------------------
   Global listeners: ripple, spotlight, tooltips, scroll progress, back-to-top
   ---------------------------------------------------------------------------- */
function initGlobalAnimations(){
  /* Ripple on any .btn */
  document.addEventListener('click', e => {
    const btn = e.target.closest('.btn');
    if(!btn) return;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });

  /* Spotlight */
  const spot = $('#spotlight');
  if(spot){
    document.addEventListener('mousemove', e => {
      spot.style.transform = `translate(${e.clientX - 250}px, ${e.clientY - 250}px)`;
      if(!spot.classList.contains('active')) spot.classList.add('active');
    });
    document.addEventListener('mouseleave', () => spot.classList.remove('active'));
  }

  /* Scroll progress */
  const sp = $('#scroll-progress');
  if(sp){
    window.addEventListener('scroll', () => {
      const h = document.documentElement;
      const pct = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
      sp.style.width = Math.min(100, Math.max(0, pct)) + '%';
    }, { passive: true });
  }

  /* Back to top */
  const bt = $('#back-top');
  if(bt){
    window.addEventListener('scroll', () => bt.classList.toggle('show', window.scrollY > 400), { passive: true });
    bt.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  }

  /* Tooltip follow (data-tooltip) */
  const tf = $('#tooltip-follow');
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-tooltip]');
    if(!t || !tf) return;
    tf.textContent = t.getAttribute('data-tooltip');
    tf.classList.add('show');
  });
  document.addEventListener('mousemove', e => {
    if(!tf) return;
    if(tf.classList.contains('show')){
      tf.style.left = (e.clientX + 12) + 'px';
      tf.style.top = (e.clientY + 16) + 'px';
    }
  });
  document.addEventListener('mouseout', e => {
    const t = e.target.closest('[data-tooltip]');
    if(t && tf) tf.classList.remove('show');
  });

  /* Keyboard shortcuts */
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const isInput = tag === 'input' || tag === 'textarea' || tag === 'select';
    const cmd = e.metaKey || e.ctrlKey;
    if(cmd && e.key.toLowerCase() === 'k'){ e.preventDefault(); state.paletteOpen ? closePalette() : openPalette(); return; }
    if(cmd && e.shiftKey && e.key.toLowerCase() === 'l'){ e.preventDefault(); toggleTheme(); render(); return; }
    if(cmd && e.shiftKey && e.key.toLowerCase() === 'd'){ e.preventDefault(); if(state.user) go('dashboard'); else go('auth'); return; }
    if(cmd && e.shiftKey && e.key.toLowerCase() === 'n'){ e.preventDefault(); openNotifications(); return; }
    if(cmd && e.shiftKey && e.key.toLowerCase() === 'm'){ e.preventDefault(); toggleDrawer(); return; }
    if(cmd && e.shiftKey && e.key === 'ArrowUp'){ e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if(e.key === 'Escape'){
      if(state.paletteOpen) closePalette();
      else if(state.notifOpen) closeNotifications();
      else if(state.chatOpen) closeChat();
      else if($('#modal-root')?.innerHTML) closeModal();
      else if(state.drawerOpen) closeDrawer();
      else if(state.view === 'auth') go('landing');
      return;
    }
    if(isInput) return;
    if(e.key === '/'){ e.preventDefault(); openPalette(); }
  });
}

/* ============================================================================
   Init
   ============================================================================ */
(function init(){
  setTheme(getTheme());
  if(state.user && state.view === 'landing') state.view = 'dashboard';
  initGlobalAnimations();
  render();
})();
