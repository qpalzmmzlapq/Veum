<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verum — платформа проверенных IT-специалистов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Verum — design tokens
   ============================================================ */
:root{
  --bg:#f4f2ee; --bg-2:#edeae4; --surface:#ffffff; --surface-2:#faf9f7; --surface-3:#f0ede7;
  --ink:#17171a; --ink-2:#56575d; --ink-3:#8e8f95; --ink-4:#b6b5b1;
  --line:#e4e1db; --line-2:#d5d1c9;
  --accent:#1e4d3a; --accent-2:#2a6a4f; --accent-3:#3d8a68; --accent-soft:#e6efe9; --accent-line:#c3d8cb;
  --warn:#b8451f; --warn-soft:#fbeee8;
  --amber:#8a6516; --amber-soft:#f7f0dd;
  --blue:#2a4f7a; --blue-soft:#e5edf7;
  --violet:#4a3a8a; --violet-soft:#ece8f7;
  --radius-sm:6px; --radius:10px; --radius-lg:16px; --radius-xl:22px;
  --shadow-sm:0 1px 2px rgba(23,23,26,.05);
  --shadow:0 1px 3px rgba(23,23,26,.06),0 8px 24px -12px rgba(23,23,26,.10);
  --shadow-lg:0 2px 6px rgba(23,23,26,.05),0 24px 60px -24px rgba(23,23,26,.18);
  --shadow-xl:0 4px 12px rgba(23,23,26,.06),0 40px 100px -30px rgba(23,23,26,.25);
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.16,.84,.44,1);
  --nav-h:64px;
}
[data-theme="dark"]{
  --bg:#0f0f12; --bg-2:#16161a; --surface:#1a1a1f; --surface-2:#1f1f25; --surface-3:#24242b;
  --ink:#f1efea; --ink-2:#b4b3ad; --ink-3:#7f7e79; --ink-4:#565650;
  --line:#2a2a31; --line-2:#383840;
  --accent:#3d8a68; --accent-2:#4fa47f; --accent-3:#62b891; --accent-soft:#1a2f25; --accent-line:#2a5442;
  --warn:#e07a52; --warn-soft:#2f1d16; --amber:#d9a93b; --amber-soft:#2d2410;
  --blue:#7aa7d9; --blue-soft:#16243a; --violet:#a695e6; --violet-soft:#241d3d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px -24px rgba(0,0,0,.7);
  --shadow-xl:0 4px 12px rgba(0,0,0,.5),0 40px 100px -30px rgba(0,0,0,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:'cv11','ss01','ss03';min-height:100vh;overflow-x:hidden;transition:background .3s ease,color .3s ease}
::selection{background:var(--accent);color:#fff}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.wrap-narrow{max-width:820px;margin:0 auto;padding:0 32px}
.wrap-wide{max-width:1320px;margin:0 auto;padding:0 32px}
.row{display:flex;align-items:center}
.row-between{display:flex;align-items:center;justify-content:space-between}
.row-wrap{display:flex;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}.gap-32{gap:32px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}.mt-48{margin-top:48px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}.mb-32{margin-bottom:32px}
.text-center{text-align:center}

.display{font-family:var(--font-sans);font-weight:600;letter-spacing:-.042em;line-height:1.04;color:var(--ink)}
h1.display{font-size:clamp(38px,5.2vw,64px)}
h2.display{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.038em}
h3.display{font-size:clamp(22px,2.2vw,27px);letter-spacing:-.03em}
h4.display{font-size:19px;letter-spacing:-.022em}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.lede{font-size:16.5px;line-height:1.58;color:var(--ink-2);max-width:56ch;letter-spacing:-.005em}
.lede-lg{font-size:18px;line-height:1.6;color:var(--ink-2);max-width:60ch;letter-spacing:-.006em}
.muted{color:var(--ink-2)}.muted-2{color:var(--ink-3)}
.mono{font-family:var(--font-mono);font-size:12px;letter-spacing:-.02em}
b,strong{font-weight:600}

/* Buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:var(--radius);font-size:14px;font-weight:500;letter-spacing:-.005em;transition:all .16s ease;white-space:nowrap;border:1px solid transparent;text-decoration:none;isolation:isolate}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-primary{background:var(--ink);color:var(--bg)}.btn-primary:hover{opacity:.88}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-2)}
.btn-ghost{border-color:var(--line-2);background:var(--surface);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-4);background:var(--surface-2)}
.btn-quiet{color:var(--ink-2);height:38px;padding:0 12px}.btn-quiet:hover{color:var(--ink);background:rgba(0,0,0,.04)}
[data-theme="dark"] .btn-quiet:hover{background:rgba(255,255,255,.06)}
.btn-lg{height:50px;padding:0 26px;font-size:15px;border-radius:12px}
.btn-sm{height:34px;padding:0 14px;font-size:13px}
.btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-link{color:var(--accent);font-weight:500;height:auto;padding:0}.btn-link:hover{text-decoration:underline}
.btn-danger{background:var(--warn);color:#fff}.btn-danger:hover{opacity:.9}
.btn-icon{width:36px;height:36px;padding:0;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:ripple .6s ease-out;pointer-events:none;z-index:-1}
@keyframes ripple{to{transform:scale(3);opacity:0}}
.btn-ghost .ripple,.btn-quiet .ripple{background:rgba(30,77,58,.15)}
[data-theme="dark"] .btn-ghost .ripple,[data-theme="dark"] .btn-quiet .ripple{background:rgba(255,255,255,.2)}

/* Nav */
.nav{position:sticky;top:0;z-index:60;background:rgba(244,242,238,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s ease,background .3s ease}
[data-theme="dark"] .nav{background:rgba(15,15,18,.82)}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:var(--nav-h);gap:16px}
.nav-left{display:flex;align-items:center;gap:10px}
.hamburger{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:background .14s ease,transform .1s ease;flex-shrink:0;border:1px solid transparent}
.hamburger:hover{background:rgba(0,0,0,.05);border-color:var(--line)}
[data-theme="dark"] .hamburger:hover{background:rgba(255,255,255,.06)}
.hamburger:active{transform:scale(.96)}
.hamburger span{display:block;width:18px;height:1.6px;background:var(--ink);border-radius:1px;position:relative;transition:background .2s ease}
.hamburger span::before,.hamburger span::after{content:'';position:absolute;left:0;width:18px;height:1.6px;background:var(--ink);border-radius:1px;transition:transform .2s ease}
.hamburger span::before{top:-6px}.hamburger span::after{top:6px}
.logo{display:inline-flex;align-items:baseline;gap:0;font-family:var(--font-sans);font-weight:700;font-size:21px;letter-spacing:-.048em;color:var(--ink);line-height:1}
.logo .dot{color:var(--accent);font-weight:700}
.nav-links{display:flex;gap:2px}
.nav-links a{position:relative;padding:8px 12px;border-radius:8px;font-size:13.5px;color:var(--ink-2);letter-spacing:-.005em;transition:color .14s ease;cursor:pointer}
.nav-links a:hover{color:var(--ink)}
.nav-links a.active{color:var(--ink);font-weight:500}
.nav-links a::after{content:'';position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .25s var(--ease)}
.nav-links a.active::after,.nav-links a:hover::after{transform:scaleX(1)}
.nav-actions{display:flex;gap:8px;align-items:center}
.nav-icon-btn{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative;transition:all .14s ease}
.nav-icon-btn:hover{background:rgba(0,0,0,.05);color:var(--ink)}
[data-theme="dark"] .nav-icon-btn:hover{background:rgba(255,255,255,.06)}
.nav-icon-btn .badge-dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}

/* Drawer */
.drawer-overlay{position:fixed;inset:0;z-index:200;background:rgba(23,23,26,.4);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .24s ease}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:201;width:min(380px,88vw);background:var(--surface);border-right:1px solid var(--line);box-shadow:var(--shadow-xl);transform:translateX(-100%);transition:transform .3s var(--ease);display:flex;flex-direction:column;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-3);transition:all .14s ease}
.drawer-close:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.drawer-body{padding:20px 16px;flex:1}
.drawer-group{margin-bottom:28px}
.drawer-group-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);padding:0 10px;margin-bottom:8px}
.drawer-link{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;font-size:14.5px;color:var(--ink-2);letter-spacing:-.005em;transition:all .14s ease;cursor:pointer;width:100%;text-align:left}
.drawer-link:hover{background:rgba(0,0,0,.045);color:var(--ink)}
[data-theme="dark"] .drawer-link:hover{background:rgba(255,255,255,.06)}
.drawer-link.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.drawer-link .arr{margin-left:auto;font-size:11px;color:var(--ink-4);transition:transform .2s ease}
.drawer-link:hover .arr{transform:translateX(3px)}
.drawer-foot{padding:20px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

/* Hero */
.hero{padding:76px 0 100px;position:relative;overflow:hidden;isolation:isolate}
.hero > .wrap{position:relative;z-index:2}
#hero-particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:.7}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:72px;align-items:center}
.hero h1{margin-bottom:24px}
.hero h1 em{font-style:normal;color:var(--accent);position:relative;display:inline-block}
.hero h1 em::after{content:'';position:absolute;left:0;right:0;bottom:4px;height:6px;background:var(--accent-soft);z-index:-1;border-radius:3px;transform:scaleX(0);transform-origin:left;animation:underline-draw .8s var(--ease) .6s forwards}
@keyframes underline-draw{to{transform:scaleX(1)}}
.hero .lede{margin-bottom:32px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-meta{margin-top:44px;padding-top:24px;border-top:1px solid var(--line);display:flex;gap:40px;flex-wrap:wrap}
.hero-stat .n{font-family:var(--font-sans);font-weight:600;font-size:26px;letter-spacing:-.035em;line-height:1.1;margin-bottom:5px;font-variant-numeric:tabular-nums}
.hero-stat .l{font-size:12.5px;color:var(--ink-3);line-height:1.45}

/* Candidate card */
.cand-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);overflow:hidden;position:relative;transition:all .3s ease}
.cand-head{padding:22px 24px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;letter-spacing:.01em;flex-shrink:0;transition:transform .2s ease}
.avatar:hover{transform:scale(1.08)}
.avatar.sm{width:34px;height:34px;font-size:12.5px}.avatar.lg{width:60px;height:60px;font-size:19px}.avatar.xl{width:80px;height:80px;font-size:26px}
.cand-body{padding:20px 24px 8px}
.score-row{margin-bottom:18px}
.score-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.score-top .k{font-size:13.5px;color:var(--ink-2);letter-spacing:-.005em}
.score-top .v{font-family:var(--font-mono);font-size:13px;font-weight:500}
.bar{height:5px;border-radius:3px;background:var(--bg-2);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width 1.1s var(--ease);width:0}
.bar > span.warn{background:var(--amber)}
.bar > span.danger{background:var(--warn)}
.cand-foot{padding:16px 24px 22px;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:7px;background:var(--bg-2);font-size:12.5px;color:var(--ink-2);font-weight:500;letter-spacing:-.005em;transition:all .14s ease}
.chip:hover{transform:translateY(-1px)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.line{background:transparent;border:1px solid var(--line-2)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.badge.junior{background:var(--bg-2);color:var(--ink-2)}
.badge.mid{background:var(--accent-soft);color:var(--accent)}
.badge.senior{background:var(--amber-soft);color:var(--amber)}
.badge.live{background:var(--warn-soft);color:var(--warn)}
.badge.live .dot-live{width:6px;height:6px;border-radius:50%;background:var(--warn);animation:pulse 1.6s infinite}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.violet{background:var(--violet-soft);color:var(--violet)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.annot{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);font-size:12.5px;display:flex;align-items:center;gap:9px;z-index:3}
.annot .ico{width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:-.02em}
.annot.a1{top:32px;right:-28px;animation:float 7s ease-in-out infinite}
.annot.a2{bottom:70px;left:-34px;animation:float 7s ease-in-out infinite .9s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* Sections */
.section{padding:96px 0}
.section-sm{padding:64px 0}
.section-lg{padding:120px 0}
.section-head{margin-bottom:56px;max-width:660px}
.section-head.center{margin-left:auto;margin-right:auto;text-align:center}
.section-head .eyebrow{margin-bottom:16px;display:block}
.section-head h2{margin-bottom:18px}
.divider{height:1px;background:var(--line)}
.bg-alt{background:var(--surface-2)}

/* Trust marquee */
.marquee{overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marquee-inner{display:flex;gap:56px;animation:marquee 32s linear infinite;width:max-content;align-items:center}
.marquee:hover .marquee-inner{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}
.trust-item{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--ink-3);white-space:nowrap}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.step{padding:32px 32px 32px 0;border-top:1px solid var(--ink);position:relative}
.step + .step{padding-left:32px;border-left:1px solid var(--line)}
.step .n{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-bottom:20px;display:block}
.step h3{font-size:17px;font-weight:600;margin-bottom:10px;letter-spacing:-.02em}
.step p{font-size:14.5px;color:var(--ink-2);line-height:1.6;letter-spacing:-.003em}

/* Stages */
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;position:relative;transition:all .2s ease}
.stage:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.stage-num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-size:13px;font-weight:600;margin-bottom:20px}
.stage h3{font-size:19px;font-weight:600;margin-bottom:8px;letter-spacing:-.022em}
.stage .sub{font-size:13px;color:var(--ink-3);margin-bottom:16px;letter-spacing:-.003em}
.stage p{font-size:14px;color:var(--ink-2);line-height:1.6;letter-spacing:-.003em;margin-bottom:16px}
.stage-tag{display:inline-block;padding:5px 10px;background:var(--bg-2);border-radius:6px;font-size:11.5px;color:var(--ink-2);font-weight:500}

/* Levels */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.level{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;transition:all .2s ease}
.level:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.level-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.level h3{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.level .sub{font-size:13.5px;color:var(--ink-3);margin-bottom:22px;letter-spacing:-.003em}
.level-list{list-style:none;display:flex;flex-direction:column;gap:11px;margin-bottom:26px;flex:1}
.level-list li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);line-height:1.5;letter-spacing:-.003em}
.level-list li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}
.level-list li.strong{color:var(--ink);font-weight:500}
.level-time{padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;justify-content:space-between}
.level-time b{color:var(--ink);font-weight:600}

.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:80px;align-items:center}
.split.reverse{grid-template-columns:1.1fr .9fr}
.split.reverse > :first-child{order:2}

/* Order mock */
.order-mock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden}
.order-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--surface-2)}
.order-body{padding:20px}
.brief{font-family:var(--font-mono);font-size:12px;line-height:1.7;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.brief .hl{color:var(--accent);font-weight:500}
.brief .hl-2{color:var(--amber);font-weight:500}
.extract{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.extract-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.extract-row .k{color:var(--ink-3)}
.extract-row .v{font-weight:500;letter-spacing:-.005em;text-align:right}
.match{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;transition:all .16s ease;background:var(--surface);cursor:pointer}
.match:hover{border-color:var(--accent-line);background:var(--surface-2);transform:translateX(2px)}
.match:last-child{margin-bottom:0}
.match-info{flex:1;min-width:0}
.match-name{font-size:14px;font-weight:500;margin-bottom:2px;letter-spacing:-.01em}
.match-why{font-size:12.5px;color:var(--ink-3);letter-spacing:-.003em}
.match-score{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--accent)}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;text-align:left;transition:all .2s ease}
.stat-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.stat-card .n{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1;margin-bottom:14px;color:var(--accent);font-variant-numeric:tabular-nums}
.stat-card .l{font-size:13.5px;color:var(--ink-2);line-height:1.5;letter-spacing:-.003em}

/* Compare */
.compare{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.compare-head,.compare-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;align-items:center}
.compare-head{background:var(--surface-2);border-bottom:1px solid var(--line);padding:16px 20px;font-size:12.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3)}
.compare-head .verum{color:var(--accent)}
.compare-row{padding:16px 20px;border-bottom:1px solid var(--line);font-size:13.5px}
.compare-row:last-child{border-bottom:none}
.compare-row .label{color:var(--ink-2)}
.compare-row .cell{color:var(--ink-2);text-align:center}
.compare-row .cell.verum{background:var(--accent-soft);color:var(--accent);font-weight:500;border-radius:6px;padding:6px 10px;margin:-6px 0}

/* Pricing */
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.pricing-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:32px 28px;display:flex;flex-direction:column;position:relative;transition:all .2s ease}
.pricing-card:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.pricing-card.featured{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.pricing-card .tag{position:absolute;top:-11px;left:28px;background:var(--accent);color:#fff;height:22px;padding:0 10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center}
.pricing-label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:14px}
.pricing-price{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.pricing-price .num{font-size:42px;font-weight:600;letter-spacing:-.045em;line-height:1}
.pricing-price .unit{font-size:13.5px;color:var(--ink-3)}
.pricing-desc{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--line);min-height:66px}
.pricing-list{list-style:none;display:flex;flex-direction:column;gap:11px;margin-bottom:26px;flex:1}
.pricing-list li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.pricing-list li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}
.pricing-list li.strong{color:var(--ink);font-weight:500}
.commission-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
.commission-item{padding:32px 28px;border-right:1px solid var(--line);position:relative}
.commission-item:last-child{border-right:none}
.commission-item .num{font-size:38px;font-weight:600;letter-spacing:-.045em;line-height:1;margin-bottom:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.commission-item .label{font-size:14px;font-weight:500;margin-bottom:5px;letter-spacing:-.008em}
.commission-item .sub{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.pricing-note{margin-top:20px;display:flex;align-items:flex-start;gap:10px;padding:16px 18px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);font-size:13px;color:var(--ink-2);line-height:1.55}
.pricing-note .dot-mark{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}
.pricing-note b{color:var(--ink);font-weight:600}

/* Calculator */
.calculator{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;margin-top:24px}
.calc-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.calc-row:last-child{margin-bottom:0}
.calc-label{font-size:13.5px;font-weight:500;color:var(--ink);min-width:150px}
.calc-slider-wrap{flex:1;min-width:220px;display:flex;align-items:center;gap:14px}
.calc-val{font-family:var(--font-mono);font-size:13.5px;font-weight:500;color:var(--accent);min-width:70px;text-align:right}
input[type="range"].styled{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--line-2);outline:none;cursor:pointer}
input[type="range"].styled::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 4px var(--accent-soft);transition:transform .15s ease}
input[type="range"].styled::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type="range"].styled::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:none;box-shadow:0 0 0 4px var(--accent-soft)}
.calc-total{padding:20px;background:var(--accent-soft);border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.calc-total .label{font-size:13px;color:var(--accent);font-weight:500}
.calc-total .value{font-size:28px;font-weight:600;color:var(--accent);letter-spacing:-.04em;font-variant-numeric:tabular-nums}

/* Testimonials */
.testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.testimonial{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;transition:all .2s ease}
.testimonial:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.testimonial .quote{font-size:14.5px;line-height:1.65;color:var(--ink-2);margin-bottom:22px}
.testimonial .author{display:flex;align-items:center;gap:12px;padding-top:18px;border-top:1px solid var(--line)}
.testimonial .author-name{font-size:13.5px;font-weight:500}
.testimonial .author-role{font-size:12px;color:var(--ink-3)}

/* FAQ */
.faq-list{display:flex;flex-direction:column;gap:0}
.faq-item{border-bottom:1px solid var(--line)}
.faq-item:first-child{border-top:1px solid var(--line)}
.faq-q{width:100%;text-align:left;padding:22px 0;display:flex;align-items:center;justify-content:space-between;font-size:15.5px;font-weight:500;letter-spacing:-.012em;color:var(--ink);transition:color .14s ease}
.faq-q:hover{color:var(--accent)}
.faq-q .sign{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);font-size:16px;color:var(--ink-2);transition:all .2s ease;flex-shrink:0}
.faq-item.open .faq-q .sign{background:var(--accent-soft);color:var(--accent);transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.16,.84,.44,1)}
.faq-item.open .faq-a{max-height:600px}
.faq-a-inner{padding:0 40px 22px 0;font-size:14.5px;line-height:1.65;color:var(--ink-2)}

/* Blog */
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.blog-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;transition:all .2s ease;cursor:pointer}
.blog-card:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.blog-cover{aspect-ratio:16/9;background:linear-gradient(135deg,var(--accent-soft) 0%,var(--bg-2) 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.blog-cover.tone-2{background:linear-gradient(135deg,var(--blue-soft) 0%,var(--bg-2) 100%)}
.blog-cover.tone-3{background:linear-gradient(135deg,var(--amber-soft) 0%,var(--bg-2) 100%)}
.blog-cover.tone-4{background:linear-gradient(135deg,var(--violet-soft) 0%,var(--bg-2) 100%)}
.blog-cover .glyph{font-size:56px;font-weight:700;letter-spacing:-.05em;color:var(--accent);opacity:.4;transition:transform .4s ease}
.blog-card:hover .glyph{transform:scale(1.15) rotate(-5deg)}
.blog-body{padding:24px}
.blog-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:12px;display:block}
.blog-title{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.35;margin-bottom:10px}
.blog-excerpt{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:16px}
.blog-meta{font-size:12px;color:var(--ink-3);display:flex;gap:10px;align-items:center}

/* Team */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px}
.member .avatar{width:64px;height:64px;border-radius:50%;font-size:20px;margin-bottom:16px}
.member-name{font-size:15.5px;font-weight:600;letter-spacing:-.015em;margin-bottom:3px}
.member-role{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
.member-bio{font-size:13px;color:var(--ink-2);line-height:1.55}

/* Timeline */
.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:var(--line-2)}
.timeline-item{position:relative;padding-bottom:40px}
.timeline-item:last-child{padding-bottom:0}
.timeline-item::before{content:'';position:absolute;left:-32px;top:6px;width:17px;height:17px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);transition:all .2s ease}
.timeline-item:hover::before{background:var(--accent);transform:scale(1.15)}
.timeline-date{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:500;margin-bottom:8px}
.timeline-title{font-size:17px;font-weight:600;margin-bottom:6px;letter-spacing:-.018em}
.timeline-desc{font-size:14px;color:var(--ink-2);line-height:1.6}

/* CTA band */
.cta-band{background:var(--ink);border-radius:var(--radius-xl);padding:64px 56px;display:flex;align-items:center;justify-content:space-between;gap:40px;flex-wrap:wrap;position:relative;overflow:hidden}
[data-theme="dark"] .cta-band{background:var(--surface-3)}
.cta-band::before{content:'';position:absolute;top:-50%;right:-10%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(61,138,104,.15),transparent 70%);pointer-events:none}

/* Contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px}
.contact-form{display:flex;flex-direction:column;gap:18px}
.contact-info-item{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.contact-info-item:last-child{border-bottom:none}
.contact-info-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:6px}
.contact-info-value{font-size:15px;font-weight:500;letter-spacing:-.008em}
.contact-info-note{font-size:13px;color:var(--ink-3);margin-top:4px}

/* Screen / auth */
.screen{min-height:100vh;display:flex;flex-direction:column}
.screen-top{padding:22px 0;border-bottom:1px solid var(--line)}
.screen-main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:56px 32px 80px}
.panel{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:40px;animation:fade-up .5s var(--ease)}
.panel.wide{max-width:760px}
@keyframes fade-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.panel-head{margin-bottom:32px}
.panel-head h2{font-size:27px;font-weight:600;letter-spacing:-.032em;margin-bottom:8px}
.panel-head p{font-size:14.5px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;background:var(--bg-2);padding:3px;border-radius:10px;margin-bottom:28px;position:relative}
.tab{flex:1;height:36px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-2);transition:all .16s ease;position:relative;z-index:1}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:7px;color:var(--ink-2)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-2);border-radius:var(--radius);padding:11px 14px;background:var(--surface);font-size:14.5px;transition:all .16s ease;outline:none}
.field textarea{resize:vertical;min-height:110px;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.error input,.field.error textarea{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.field .hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.field .hint.err{color:var(--warn)}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.role-card{border:1px solid var(--line-2);border-radius:var(--radius);padding:16px;text-align:left;transition:all .16s ease;background:var(--surface)}
.role-card:hover{border-color:var(--ink-4);transform:translateY(-1px)}
.role-card.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.role-card .t{font-size:14px;font-weight:600;margin-bottom:3px}
.role-card .d{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.role-card.active .d{color:var(--accent)}
.switch-line{text-align:center;margin-top:22px;font-size:13.5px;color:var(--ink-3)}
.switch-line button{color:var(--accent);font-weight:500}
.switch-line button:hover{text-decoration:underline}

/* Dashboard */
.dash{display:grid;grid-template-columns:240px 1fr;gap:0;min-height:100vh}
.side{border-right:1px solid var(--line);padding:24px 20px;background:var(--surface-2);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.side-nav{display:flex;flex-direction:column;gap:2px;margin-top:28px;flex:1}
.side-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13.5px;color:var(--ink-2);transition:all .14s ease;text-align:left;width:100%}
.side-link:hover{background:rgba(0,0,0,.045);color:var(--ink)}
[data-theme="dark"] .side-link:hover{background:rgba(255,255,255,.06)}
.side-link.active{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-sm)}
.side-link .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.side-user{padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.side-user .info{flex:1;min-width:0}
.side-user .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .rl{font-size:11.5px;color:var(--ink-3)}
.dash-main{padding:36px 40px 80px;max-width:1000px}
.dash-head{margin-bottom:32px}
.dash-head h1{font-size:30px;font-weight:600;letter-spacing:-.035em;margin-bottom:6px}
.dash-head p{color:var(--ink-2);font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;transition:all .2s ease}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.card-head h3{font-size:16px;font-weight:600;letter-spacing:-.015em}
.card-head .sub{font-size:12.5px;color:var(--ink-3)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;transition:all .2s ease}
.metric:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.metric .l{font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
.metric .v{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1.05;margin-bottom:6px;font-variant-numeric:tabular-nums}
.metric .d{font-size:12px;color:var(--ink-3)}
.metric .d.up{color:var(--accent)}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 32px}
.project{display:flex;align-items:flex-start;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.project:last-child{border-bottom:none;padding-bottom:0}
.project:first-child{padding-top:0}
.project .repo{font-family:var(--font-mono);font-size:13px;font-weight:500;margin-bottom:4px}
.project .desc{font-size:13px;color:var(--ink-2);margin-bottom:7px}
.project .meta{display:flex;gap:6px;flex-wrap:wrap}
.project .stat{margin-left:auto;text-align:right;flex-shrink:0}
.project .stat .n{font-family:var(--font-mono);font-size:13px;font-weight:500}
.project .stat .l{font-size:11px;color:var(--ink-3)}
.offer{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;transition:all .16s ease}
.offer:hover{border-color:var(--line-2);background:var(--surface-2);transform:translateX(2px)}
.offer-info{flex:1;min-width:0}
.offer-title{font-size:14.5px;font-weight:500;margin-bottom:3px}
.offer-meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:14px}
.offer-budget{font-family:var(--font-mono);font-size:13.5px;font-weight:500}
.commission-notice{display:flex;align-items:center;gap:20px;padding:20px 24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:16px}
.commission-notice .num{font-size:30px;font-weight:600;letter-spacing:-.04em;color:var(--accent);line-height:1;flex-shrink:0}
.commission-notice .body{flex:1;min-width:0}
.commission-notice .body .t{font-size:14px;font-weight:500;margin-bottom:3px}
.commission-notice .body .d{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.profile-status{display:flex;align-items:center;gap:20px;padding:24px;border:1px dashed var(--line-2);border-radius:var(--radius-lg);background:var(--surface-2);margin-bottom:16px}
.profile-status.filled{border-style:solid;border-color:var(--accent-line);background:var(--accent-soft)}
.profile-status .ico{width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.profile-status .body{flex:1;min-width:0}
.profile-status .body .t{font-size:15px;font-weight:600;letter-spacing:-.012em;margin-bottom:4px}
.profile-status .body .d{font-size:13px;color:var(--ink-2);line-height:1.5}

/* Notifications, chat, palette, modal, toast */
.notif-overlay{position:fixed;inset:0;z-index:220;background:rgba(23,23,26,.3);opacity:0;pointer-events:none;transition:opacity .2s ease}
.notif-overlay.open{opacity:1;pointer-events:auto}
.notif-panel{position:fixed;top:calc(var(--nav-h) + 8px);right:24px;z-index:221;width:min(400px,calc(100vw - 32px));max-height:min(560px,calc(100vh - 100px));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl);display:flex;flex-direction:column;transform:translateY(-8px);opacity:0;pointer-events:none;transition:all .22s var(--ease)}
.notif-panel.open{transform:translateY(0);opacity:1;pointer-events:auto}
.notif-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.notif-head h4{font-size:14px;font-weight:600}
.notif-body{flex:1;overflow-y:auto;padding:8px}
.notif-item{display:flex;gap:12px;padding:12px;border-radius:9px;cursor:pointer;transition:background .14s ease;position:relative}
.notif-item:hover{background:var(--surface-2)}
.notif-item.unread::before{content:'';position:absolute;left:4px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)}

.notif-empty{padding:32px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.chat-panel{position:fixed;bottom:24px;right:24px;z-index:230;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100vh - 100px));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl);display:flex;flex-direction:column;transform:translateY(20px);opacity:0;pointer-events:none;transition:all .25s var(--ease)}

.chat-head .nm{font-size:14px;font-weight:600}
.chat-head .st{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.chat-head .st .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:80%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;animation:msg-in .3s var(--ease)}
@keyframes msg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.in{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-msg.out{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.chat-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}
.chat-foot input{flex:1;border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;font-size:13.5px;outline:none;background:var(--surface)}
.chat-foot input:focus{border-color:var(--accent)}
.palette-overlay{position:fixed;inset:0;z-index:240;background:rgba(23,23,26,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .18s ease}
.palette-overlay.open{opacity:1;pointer-events:auto}
.palette{position:fixed;top:18vh;left:50%;transform:translateX(-50%) translateY(-8px);z-index:241;width:min(560px,calc(100vw - 32px));max-height:60vh;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl);display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;transition:all .2s var(--ease)}
.palette.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.palette-input{border:none;padding:16px 20px;font-size:15px;background:transparent;outline:none;border-bottom:1px solid var(--line)}
.palette-list{flex:1;overflow-y:auto;padding:8px}
.palette-group{padding:8px 12px 4px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.palette-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .12s ease}
.palette-item:hover,.palette-item.active{background:var(--surface-2)}
.palette-item .ico{width:26px;height:26px;border-radius:6px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2);flex-shrink:0}
.palette-item .t{font-size:13.5px;font-weight:500}
.palette-item .d{font-size:11.5px;color:var(--ink-3)}
.palette-item .kbd{margin-left:auto}
.palette-empty{padding:24px 16px;text-align:center;font-size:13px;color:var(--ink-3)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:var(--surface-3);border:1px solid var(--line);font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.modal-overlay{position:fixed;inset:0;z-index:250;background:rgba(23,23,26,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;animation:modalIn .3s var(--ease)}
.modal.modal-lg{max-width:760px}.modal.modal-sm{max-width:420px}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{padding:24px 28px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}

.modal-foot{padding:18px 28px 24px;display:flex;gap:10px;justify-content:flex-end}
.modal-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-3);transition:all .14s ease}
.modal-close:hover{background:var(--surface-2);color:var(--ink)}
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 12px 32px -8px rgba(0,0,0,.4);animation:toastIn .3s var(--ease);display:flex;align-items:center;gap:9px;max-width:min(420px,calc(100vw - 32px));pointer-events:auto}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.footer{border-top:1px solid var(--line);padding:56px 0 40px;margin-top:40px;background:var(--surface-2)}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;gap:40px;margin-bottom:48px}
.footer-col h5{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:16px}
.footer-col a{display:block;font-size:13.5px;color:var(--ink-2);padding:5px 0;transition:color .14s ease;cursor:pointer}
.footer-col a:hover{color:var(--ink);transform:translateX(2px)}
.footer-bottom{padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap;gap:12px}

/* Animation & interaction additions */
.scroll-progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-3));z-index:9999;transition:width .1s linear;box-shadow:0 0 10px var(--accent);width:0}
#spotlight{position:fixed;top:0;left:0;width:500px;height:500px;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(30,77,58,.07) 0%,transparent 65%);transition:transform .18s ease-out;will-change:transform;opacity:0}
#spotlight.active{opacity:1}
[data-theme="dark"] #spotlight{background:radial-gradient(circle,rgba(61,138,104,.08) 0%,transparent 65%)}
[data-reveal]{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.16,.84,.44,1),transform .8s cubic-bezier(.16,.84,.44,1)}
[data-reveal].revealed{opacity:1;transform:translateY(0)}
[data-reveal="left"]{transform:translateX(-40px)}
[data-reveal="right"]{transform:translateX(40px)}
[data-reveal="scale"]{transform:scale(.94)}
[data-reveal="fade"]{transform:none}
[data-delay="1"]{transition-delay:.08s}
[data-delay="2"]{transition-delay:.16s}
[data-delay="3"]{transition-delay:.24s}
[data-delay="4"]{transition-delay:.32s}
[data-delay="5"]{transition-delay:.4s}
[data-delay="6"]{transition-delay:.48s}
[data-tilt]{transition:transform .15s ease-out;will-change:transform}
[data-magnetic]{transition:transform .2s ease-out;will-change:transform}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:9999;width:100%;height:100%}
.back-top{position:fixed;right:24px;bottom:24px;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:80;opacity:0;transform:translateY(20px) scale(.8);transition:all .35s cubic-bezier(.16,.84,.44,1);box-shadow:var(--shadow-lg);font-size:18px}
.back-top.show{opacity:1;transform:translateY(0) scale(1)}
.back-top:hover{transform:translateY(-3px) scale(1.05)}
.tooltip-follow{position:fixed;pointer-events:none;z-index:9998;padding:6px 10px;background:var(--ink);color:var(--bg);font-size:11.5px;border-radius:6px;opacity:0;transform:translateY(4px);transition:opacity .15s ease,transform .15s ease;white-space:nowrap;font-weight:500}
.tooltip-follow.show{opacity:1;transform:translateY(0)}
.page-transition{position:fixed;inset:0;background:var(--bg);z-index:9997;pointer-events:none;opacity:0;transition:opacity .25s ease}
.page-transition.active{opacity:1}
.check-draw{stroke-dasharray:30;stroke-dashoffset:30;animation:draw-check .6s ease forwards .2s}
@keyframes draw-check{to{stroke-dashoffset:0}}
.wizard-steps{display:flex;gap:6px;margin-bottom:24px}
.wizard-step{flex:1;height:4px;background:var(--line);border-radius:2px;transition:background .4s ease}
.wizard-step.active{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.wizard-step.done{background:var(--accent-2)}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kanban-col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;min-height:300px;transition:all .2s ease}
.kanban-col.drag-over{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
.kanban-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:grab;transition:all .2s ease;font-size:13px}
.kanban-card:hover{box-shadow:var(--shadow);border-color:var(--line-2);transform:translateY(-1px)}
.kanban-card.dragging{opacity:.4;cursor:grabbing;transform:rotate(2deg)}
.kanban-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.chart-svg{width:100%;height:120px;overflow:visible}
@keyframes draw-line{to{stroke-dashoffset:0}}
@keyframes fade-in-anim{to{opacity:1}}
.ring{position:relative;width:120px;height:120px;display:inline-block}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.live-ticker{display:flex;flex-direction:column;gap:0;max-height:320px;overflow-y:auto}
.ticker-item{padding:12px 0;border-bottom:1px solid var(--line);animation:slide-in .5s var(--ease);display:flex;gap:12px;align-items:flex-start}
.ticker-item:last-child{border-bottom:none}
.ticker-item .ico{width:28px;height:28px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.ticker-item .t{font-size:12.5px;line-height:1.5}
.ticker-item .time{font-size:11px;color:var(--ink-4);margin-top:2px}
@keyframes slide-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.gradient-border{position:relative;background:var(--surface);border-radius:var(--radius-lg);padding:24px}
.gradient-border::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(135deg,var(--accent),var(--amber),var(--blue),var(--accent));background-size:300% 300%;animation:gradient-shift 8s ease infinite;z-index:-1;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes gradient-shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.shortcuts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}
.shortcut-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;gap:12px}
.type-cursor::after{content:'|';animation:blink 1s step-end infinite;color:var(--accent);font-weight:400;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.skeleton{background:linear-gradient(90deg,var(--bg-2) 25%,var(--surface-2) 50%,var(--bg-2) 75%);background-size:200% 100%;animation:skeleton-shimmer 1.6s infinite;border-radius:6px;height:12px;margin-bottom:10px}
@keyframes skeleton-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-3px)}40%,60%{transform:translateX(3px)}}
.shake{animation:shake .5s ease}
.empty-state{padding:48px 24px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--radius-lg);background:var(--surface-2)}
.empty-state .ico{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px}
.empty-state .t{font-size:15px;font-weight:600;margin-bottom:6px}
.empty-state .d{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:18px;max-width:400px;margin-left:auto;margin-right:auto}
.rating{display:inline-flex;gap:2px;align-items:center;color:var(--amber);font-size:13px}
.rating .star{opacity:.25;transition:opacity .15s ease}
.rating .star.on{opacity:1}
.rating-num{font-size:12px;color:var(--ink-3);margin-left:4px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.search-bar{position:relative;flex:1;min-width:220px;max-width:360px}
.search-bar input{width:100%;height:38px;border:1px solid var(--line-2);border-radius:9px;padding:0 14px 0 36px;background:var(--surface);font-size:13.5px;outline:none;transition:all .16s ease}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-bar .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3);pointer-events:none}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:all .14s ease}
.filter-chip:hover{border-color:var(--ink-4);color:var(--ink)}
.filter-chip.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.sort-select{height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:12.5px;color:var(--ink-2);outline:none;cursor:pointer}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.toggle-track{width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;transition:background .2s ease;flex-shrink:0}
.toggle-track::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.toggle.on .toggle-track{background:var(--accent)}
.toggle.on .toggle-track::after{transform:translateX(14px)}
.tour-overlay{position:fixed;inset:0;z-index:260;background:rgba(23,23,26,.6);backdrop-filter:blur(2px);animation:fadeIn .2s ease}
.tour-box{position:fixed;z-index:261;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl);padding:22px;animation:modalIn .3s var(--ease)}
.tour-box .step{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:10px}
.tour-box .t{font-size:16px;font-weight:600;letter-spacing:-.015em;margin-bottom:8px}
.tour-box .d{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:18px}
.sound-toggle{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);transition:all .15s ease}
.sound-toggle:hover{background:var(--surface-2);color:var(--ink)}
.activity-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.activity-item:last-child{border-bottom:none}
.activity-item .ico{width:30px;height:30px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.activity-item .body{flex:1;min-width:0}
.activity-item .t{font-size:13px;line-height:1.5}
.activity-item .t b{font-weight:600}
.activity-item .time{font-size:11.5px;color:var(--ink-4);margin-top:3px}
.compare-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.compare-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;position:relative;transition:all .2s ease}
.compare-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.compare-card.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.compare-card .best-tag{position:absolute;top:-10px;left:16px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;height:20px;padding:0 8px;border-radius:5px;display:inline-flex;align-items:center}
.flip{perspective:1000px}
.flip-inner{position:relative;transition:transform .8s cubic-bezier(.16,.84,.44,1);transform-style:preserve-3d}
.flip:hover .flip-inner{transform:rotateY(180deg)}
.flip-face{backface-visibility:hidden}
.flip-back{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden}

@media(max-width:1024px){
  .hero-grid{grid-template-columns:1fr;gap:56px}
  .hero{padding:56px 0 72px}
  .annot{display:none}
  .split,.split.reverse{grid-template-columns:1fr;gap:48px}
  .split.reverse > :first-child{order:0}
  .steps{grid-template-columns:1fr}
  .step{padding:28px 0;border-left:none !important}
  .step + .step{border-top:1px solid var(--line)}
  .stages,.levels,.pricing-grid,.testimonials,.team{grid-template-columns:1fr}
  .commission-strip{grid-template-columns:1fr}
  .commission-item{border-right:none;border-bottom:1px solid var(--line)}
  .commission-item:last-child{border-bottom:none}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .blog-grid{grid-template-columns:1fr 1fr}
  .contact-grid{grid-template-columns:1fr;gap:48px}
  .footer-grid{grid-template-columns:1fr 1fr;gap:32px}
  .dash{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .side-nav{flex-direction:row;overflow-x:auto;margin-top:16px}
  .side-link{white-space:nowrap}
  .dash-main{padding:28px 24px 60px}
  .skill-grid,.metrics{grid-template-columns:1fr}
  .cta-band{padding:40px 32px}
  .nav-links{display:none}
  .compare-cards{grid-template-columns:1fr}
  .kanban{grid-template-columns:1fr}
}
@media(max-width:640px){
  .wrap,.wrap-narrow,.wrap-wide{padding:0 20px}
  .hero-meta{gap:24px;flex-wrap:wrap}
  .panel{padding:28px 22px}
  .role-grid,.footer-grid,.stats-grid,.blog-grid,.team{grid-template-columns:1fr}
  .cta-band{padding:32px 24px}
  .modal-body,.modal-head,.modal-foot{padding-left:20px;padding-right:20px}
  .chat-panel,.notif-panel{right:12px;left:12px;width:auto}
  .palette{top:8vh}
  .shortcuts-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>
</head>

/* ----------------------------------------------------------------------------
   Animation engine
   ---------------------------------------------------------------------------- */
const Anim = {
  ease: {
    outCubic: t => 1 - Math.pow(1 - t, 3),
    outQuart: t => 1 - Math.pow(1 - t, 4),
    outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
    inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
  },
  tween(from, to, dur, cb, easeFn = 'outCubic'){
    const ease = Anim.ease[easeFn] || Anim.ease.outCubic;
    const start = performance.now();
    const step = now => {
      const t = Math.min(1, (now - start) / dur);
      cb(from + (to - from) * ease(t), t);
      if(t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },
  countUp(el, to, opts = {}){
    const dur = opts.dur || 1500;
    const start = opts.start || 0;
    const prefix = opts.prefix || '';
    const suffix = opts.suffix || '';
    const decimals = opts.decimals || 0;
    Anim.tween(start, to, dur, v => {
      el.textContent = prefix + v.toFixed(decimals) + suffix;
    }, 'outQuart');
  },
  stagger(els, prop, from, to, dur, delay){
    els.forEach((el, i) => {
      setTimeout(() => Anim.tween(from, to, dur, v => { el.style[prop] = v + (typeof to === 'number' && to < 100 ? '%' : 'px'); }, 'outCubic'), i * delay);
    });
  }
};

/* ----------------------------------------------------------------------------
   Sound engine (Web Audio) — tiny chirps
   ---------------------------------------------------------------------------- */
const Sound = {
  enabled: (() => { try { return localStorage.getItem(SOUND_KEY) !== 'off'; } catch(e){ return true; } })(),
  ctx: null,
  ensure(){
    if(!this.ctx){
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
  },
  play(freq = 600, dur = 60, type = 'sine', vol = 0.04){
    if(!this.enabled) return;
    this.ensure();
    if(!this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur / 1000);
    o.connect(g);
    g.connect(this.ctx.destination);
    o.start();
    o.stop(this.ctx.currentTime + dur / 1000);
  },
  click(){ this.play(520, 40, 'sine', .03); },
  success(){ this.play(660, 80, 'sine', .05); setTimeout(() => this.play(880, 100, 'sine', .05), 80); },
  error(){ this.play(280, 100, 'triangle', .04); },
  toggle(){
    this.enabled = !this.enabled;
    try { localStorage.setItem(SOUND_KEY, this.enabled ? 'on' : 'off'); } catch(e){}
    if(this.enabled) this.success();
  }
};

/* ----------------------------------------------------------------------------
   Confetti
   ---------------------------------------------------------------------------- */
function confetti(x, y){
  const canvas = $('#confetti-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  const N = 70;
  const parts = [];
  const colors = ['#1e4d3a','#2a6a4f','#3d8a68','#8a6516','#2a4f7a','#b8451f','#4a3a8a'];
  for(let i = 0; i < N; i++){
    parts.push({
      x: x * devicePixelRatio, y: y * devicePixelRatio,
      vx: (Math.random() - .5) * 14 * devicePixelRatio,
      vy: (Math.random() - 1.2) * 12 * devicePixelRatio,
      r: (Math.random() * 4 + 2),
      color: colors[i % colors.length],
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - .5) * .3,
      life: 1
    });
  }
  let raf;
  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    parts.forEach(p => {
      if(p.life <= 0) return;
      alive = true;
      p.vy += .5 * devicePixelRatio;
      p.vx *= .99;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= .007;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    if(alive) raf = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  cancelAnimationFrame(raf);
  draw();
}

function toast(text, ms = 2800){

function openPalette(){ state.paletteOpen = true; const p = $('#palette'); if(!p) return; p.classList.add('open'); p.setAttribute('aria-hidden','false'); $('#palette-overlay')?.classList.add('open'); const i = $('#palette-input'); if(i){ i.value = ''; i.focus(); } renderPalette(''); }
function closePalette(){ state.paletteOpen = false; const p = $('#palette'); if(!p) return; p.classList.remove('open'); p.setAttribute('aria-hidden','true'); $('#palette-overlay')?.classList.remove('open'); }
function renderPalette(q){
  const list = $('#palette-list'); if(!list) return;
  const query = q.trim().toLowerCase();
  let items = PALETTE_ACTIONS.filter(a => !query || a.t.toLowerCase().includes(query) || a.d.toLowerCase().includes(query));
  const recents = state.recents.map(id => PALETTE_ACTIONS.find(a => a.id === id)).filter(Boolean);
  const groups = {};
  if(!query && recents.length){
    groups['Недавние'] = recents.slice(0, 3);
  }
  items.forEach(a => { (groups[a.group] = groups[a.group] || []).push(a); });
  if(!items.length && !Object.keys(groups).length){ list.innerHTML = '<div class="palette-empty">Ничего не найдено</div>'; return; }
  let html = '';
  Object.entries(groups).forEach(([g, arr]) => {
    html += `<div class="palette-group">${g}</div>`;
    html += arr.map((a, i) => `
      <div class="palette-item ${!html.includes('active') && g === Object.keys(groups)[0] && i === 0 ? 'active' : ''}" data-palette-idx data-palette-action="${a.action || ''}" data-palette-go="${a.id || ''}">
        <div class="ico">${a.ico}</div>
        <div>
          <div class="t">${a.t}</div>
          <div class="d">${a.d}</div>
        </div>
        ${a.id ? '<span class="kbd">↵</span>' : ''}
      </div>`).join('');
  });
  list.innerHTML = html;
  $$('[data-palette-go]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.paletteGo;
    if(!id) return;
    if(id === 'dashboard' && !state.user) return go('auth');
    state.recents = [id, ...state.recents.filter(x => x !== id)].slice(0, 5); save();
    go(id);
  }));
  $$('[data-palette-action]').forEach(el => el.addEventListener('click', () => {
    const a = el.dataset.paletteAction; if(!a) return;
    closePalette();
    if(a === 'toggle-theme') toggleTheme();
    if(a === 'toggle-sound') Sound.toggle();
    if(a === 'shortcuts') openShortcutsModal();
  }));
}

function openModal(content, opts = {}){
  const root = $('#modal-root'); if(!root) return;
  const sizeClass = opts.size ? 'modal-' + opts.size : '';
  root.innerHTML = `
    <div class="modal-overlay" data-modal-overlay>
      <div class="modal ${sizeClass}" role="dialog" aria-modal="true">${content}</div>
    </div>`;
  $$('[data-modal-overlay]').forEach(el => el.addEventListener('click', e => { if(e.target === el) closeModal(); }));
  $$('[data-modal-close]').forEach(el => el.addEventListener('click', closeModal));
}

function initHeroParticles(){
  const canvas = $('#hero-particles');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], raf;
  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();
    W = canvas.width = rect.width * devicePixelRatio;
    H = canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
  }
  resize();
  const ro = new ResizeObserver(resize);
  ro.observe(canvas.parentElement);
  const N = 40;
  for(let i = 0; i < N; i++){
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4,
      r: (Math.random() * 2 + 1) * devicePixelRatio
    });
  }
  const mouse = { x: -9999, y: -9999 };
  canvas.parentElement.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * devicePixelRatio;
    mouse.y = (e.clientY - r.top) * devicePixelRatio;
  });
  canvas.parentElement.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  function draw(){
    ctx.clearRect(0, 0, W, H);
    const maxD = 130 * devicePixelRatio;
    for(let i = 0; i < N; i++){
      for(let j = i + 1; j < N; j++){
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d2 = dx*dx + dy*dy;
        if(d2 < maxD * maxD){
          const a = (1 - Math.sqrt(d2) / maxD) * .18;
          ctx.strokeStyle = `rgba(30,77,58,${a})`;
          ctx.lineWidth = 1 * devicePixelRatio;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    particles.forEach(p => {
      // mouse repulsion
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx*dx + dy*dy;
      if(d2 < (90*devicePixelRatio)**2 && d2 > 0){
        const d = Math.sqrt(d2);
        p.vx += (dx / d) * .15;
        p.vy += (dy / d) * .15;
      }
      p.vx *= .99; p.vy *= .99;
      ctx.fillStyle = 'rgba(30,77,58,.4)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > W) p.vx *= -1;
      if(p.y < 0 || p.y > H) p.vy *= -1;
    });
    raf = requestAnimationFrame(draw);
  }
  cancelAnimationFrame(raf);
  draw();
}

function initCalculator(){
  const spec = $('#calc-spec'), budget = $('#calc-budget'), tier = $('#calc-tier');
  const specV = $('#calc-spec-val'), budgetV = $('#calc-budget-val'), total = $('#calc-total');
  if(!spec || !budget || !tier || !total) return;
  let curTotal = 0;
  function fmt(n){ return n.toLocaleString('ru-RU') + ' ₽'; }
  function update(){
    const n = +spec.value;
    const b = +budget.value;
    const t = +tier.value;
    specV.textContent = n;
    budgetV.textContent = b.toLocaleString('ru-RU');
    const target = t + (n > 3 ? (n - 3) * 500 : 0);
    Anim.tween(curTotal, target, 400, v => { total.textContent = fmt(Math.round(v)); });
    curTotal = target;
  }
  spec.addEventListener('input', update);
  budget.addEventListener('input', update);
  tier.addEventListener('change', update);
  update();
}

          <div class="d">Ваш профиль подтверждён. Итоговый балл: ${overall}. Вы попадаете в подборки заказчиков.</div></div>

      <div class="skill-grid">
        ${scoreBlock('Анализ GitHub', tested ? 84 : 0, false)}

        ${scoreBlock('Адаптация к требованиям', tested ? p.scores.adapt : 0, tested && p.scores.adapt < 70)}

        </div>

    </div>

    <div class="card" data-reveal>

function ratingHtml(n){
  let out = '';
  for(let i = 1; i <= 5; i++) out += `<span class="star ${i <= Math.round(n) ? 'on' : ''}">★</span>`;
  return out;
}

function filterSpecialists(list){
  const f = state.filters;
  return list.filter(s => {
    if(f.level !== 'all' && s.level !== f.level) return false;
    if(f.search){
      const q = f.search.toLowerCase();
      const hay = (s.name + ' ' + s.role + ' ' + s.skills.join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ----------------------------------------------------------------------------
   Wizard for order creation
   ---------------------------------------------------------------------------- */
const wizardState = { step: 0, title: '', brief: '', budget: '', stack: [], level: 'mid' };

function renderWizard(){
  const body = $('#wiz-body');
  if(!body) return;
  const steps = document.querySelectorAll('[data-wiz-step]');
  steps.forEach((el, i) => {
    el.classList.toggle('active', i === wizardState.step);
    el.classList.toggle('done', i < wizardState.step);
  });
  const numEl = $('#wiz-step-num');
  if(numEl) numEl.textContent = wizardState.step + 1;
  const prev = $('#wiz-prev');
  const next = $('#wiz-next');
  if(prev) prev.style.visibility = wizardState.step === 0 ? 'hidden' : 'visible';
  if(next) next.textContent = wizardState.step === 2 ? 'Разобрать и подобрать' : 'Далее';

  if(wizardState.step === 0){
    body.innerHTML = `
      <div class="field"><label>Название</label>
        <input type="text" id="wiz-title" placeholder="Например: Переписать личный кабинет на React" value="${escapeHtml(wizardState.title)}"></div>
      <div class="field" style="margin-bottom:0"><label>Кратко о задаче</label>
        <textarea id="wiz-brief-short" placeholder="Пара предложений о том, что нужно сделать" style="min-height:80px">${escapeHtml(wizardState.brief)}</textarea></div>`;
    $('#wiz-title')?.addEventListener('input', e => wizardState.title = e.target.value);
    $('#wiz-brief-short')?.addEventListener('input', e => wizardState.brief = e.target.value);
  } else if(wizardState.step === 1){
    body.innerHTML = `
      <div class="field"><label>Подробное описание</label>
        <textarea id="wiz-brief" placeholder="Стек, сроки, формат работы, что критично" style="min-height:120px">${escapeHtml(wizardState.brief)}</textarea></div>
      <div class="field" style="margin-bottom:0"><label>Стек (через запятую)</label>
        <input type="text" id="wiz-stack" placeholder="React, TypeScript, REST" value="${escapeHtml(wizardState.stack.join(', '))}"></div>`;
    $('#wiz-brief')?.addEventListener('input', e => wizardState.brief = e.target.value);
    $('#wiz-stack')?.addEventListener('input', e => wizardState.stack = e.target.value.split(',').map(x => x.trim()).filter(Boolean));
  } else {
    body.innerHTML = `
      <div class="field"><label>Бюджет</label>
        <input type="text" id="wiz-budget" placeholder="180 000 ₽ или «по договорённости»" value="${escapeHtml(wizardState.budget)}"></div>
      <div class="field" style="margin-bottom:0"><label>Уровень</label>
        <select id="wiz-level">
          <option value="junior" ${wizardState.level === 'junior' ? 'selected' : ''}>Junior</option>
          <option value="mid" ${wizardState.level === 'mid' ? 'selected' : ''}>Middle и выше</option>
          <option value="senior" ${wizardState.level === 'senior' ? 'selected' : ''}>Senior</option>
        </select></div>`;
    $('#wiz-budget')?.addEventListener('input', e => wizardState.budget = e.target.value);
    $('#wiz-level')?.addEventListener('change', e => wizardState.level = e.target.value);
  }
}

function initWizard(){
  const next = $('#wiz-next'); const prev = $('#wiz-prev');
  if(!next) return;
  if(wizardState.step === 0 && wizardState.title === ''){
    // fill defaults for demo
    wizardState.title = 'Переписать личный кабинет на React';
    wizardState.brief = 'Нужен фронтендер на переписывание личного кабинета. Стек — React + TypeScript, бэкенд на REST. Обязательно опыт с ИИ-ассистентами. Срок — 6 недель, загрузка частичная.';
    wizardState.budget = '180 000 ₽';
    wizardState.stack = ['React', 'TypeScript', 'REST'];
  }
  renderWizard();
  prev.addEventListener('click', () => { if(wizardState.step > 0){ wizardState.step--; renderWizard(); } });
  next.addEventListener('click', () => {
    if(wizardState.step === 0 && !wizardState.title){
      toast('Укажите название заказа'); return;
    }
    if(wizardState.step < 2){
      wizardState.step++;
      renderWizard();
    } else {
      next.disabled = true; next.textContent = 'Подбираем…';
      setTimeout(() => {
        const order = {
          id: 'or-' + Date.now(),
          title: wizardState.title,
          brief: wizardState.brief,
          budget: wizardState.budget,
          stack: wizardState.stack,
          level: wizardState.level,
          ai: 'Обязательна',
          matches: MOCK_SPECIALISTS.slice(0, 3),
          status: 'Ищем исполнителя'
        };
        state.orders = state.orders && state.orders.length ? state.orders.concat([order]) : [order];
        state.sideTab = 'orders';
        save();
        confetti(innerWidth / 2, innerHeight / 2);
        Sound.success();
        toast('Заказ создан · подобрано 3 специалиста');
        render();
      }, 1200);
    }
  });
}

/* ----------------------------------------------------------------------------
   Kanban drag & drop
   ---------------------------------------------------------------------------- */
function initKanban(){
  const kanban = $('#kanban');
  if(!kanban) return;
  const cards = kanban.querySelectorAll('.kanban-card');
  let dragged = null;
  cards.forEach(card => {
    card.addEventListener('dragstart', e => {
      dragged = card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      dragged = null;
      updateKanbanCounts();
    });
  });
  kanban.querySelectorAll('.kanban-col').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      if(dragged && !col.contains(dragged)){
        col.appendChild(dragged);
        Sound.click();
        updateKanbanCounts();
      }
    });
  });
}
function updateKanbanCounts(){
  $$('.kanban-col').forEach(col => {
    const cnt = col.querySelectorAll('.kanban-card').length;
    const el = col.querySelector('[data-count-col]');
    if(el) el.textContent = cnt;
  });
}

    if(wrap) wrap.style.display = 'block'; if(foot) foot.style.display = 'none';
    const steps = [
      { t:'Чтение GitHub', d:'Публичные репозитории, языки, активность' },
      { t:'Архитектура', d:'Проектирование системы по требованиям' },
      { t:'Ревью кода ИИ', d:'Поиск дефектов в сгенерированном коде' },
      { t:'Адаптация', d:'Изменение требований на ходу' },
      { t:'Формирование профиля', d:'Баллы и рекомендации' }
    ];
    const list = $('#test-list'); const bar = $('#test-bar');
    if(!list || !bar) return;
    list.innerHTML = steps.map((s, i) => `
      <div class="analysis-item" data-test-item="${i}">
        <div class="analysis-mark">✓</div>
        <div class="analysis-text"><div class="t">${s.t}</div><div class="d">${s.d}</div></div>
        <div class="analysis-val">—</div>
      </div>`).join('');
    let i = 0;
    const items = $$('[data-test-item]');
    const tick = () => {
      if(i > 0){ items[i - 1].classList.remove('on'); items[i - 1].classList.add('done'); }
      if(i >= items.length){
        bar.style.width = '100%';
        setTimeout(() => {
          state.profile.tested = true;
          const lvl = state.level || 'mid';
          state.profile.scores = lvl === 'junior' ? { arch:58, code:72, ai:55, adapt:60 }
            : lvl === 'senior' ? { arch:94, code:91, ai:88, adapt:90 }
            : { arch:82, code:86, ai:78, adapt:74 };
          save(); closeModal(); render();
          Sound.success(); confetti(innerWidth / 2, innerHeight / 2);
          toast('Проверка пройдена · балл ' + Math.round((state.profile.scores.arch + state.profile.scores.code + state.profile.scores.ai + state.profile.scores.adapt) / 4));
        }, 500);
        return;
      }
      items[i].classList.add('on');
      bar.style.width = Math.round(((i + 1) / items.length) * 100) + '%';
      i++;
      setTimeout(tick, 700 + Math.random() * 500);
    };
    setTimeout(tick, 400);
  });
}
